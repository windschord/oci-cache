# 配布物の生成
#
# linux/arm64 と linux/amd64 の双方で動く実行ファイルを提供すること自体が
# 要求（REQ-0053）であり、配布は単一の実行ファイルで完結する（REQ-0050）。
# 公開リポジトリなので arm64 のランナーがそのまま使え、クロスコンパイルの
# 仕組みを持ち込まずに実機と同じ組み合わせで組める。
name: release

on:
  push:
    tags: ["v*"]
  # タグを打つ前に両アーキテクチャで組めることだけ確かめたいときのため
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ビルド (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: リリースビルド
        run: cargo build --release --locked

      # 実行ファイル1つと、動かすのに要る最低限の文書だけを固める。
      # 外部データベースも常駐プロセスも同梱しない（REQ-0050）
      - name: 成果物の作成
        id: package
        run: |
          set -euo pipefail
          name="oci-cache-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp target/release/oci-cache "dist/${name}/"
          cp README.md LICENSE config.example.toml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: リリースへの添付
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: リリースの作成と添付
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
