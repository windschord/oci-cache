# Rust の検査とビルド
#
# 要求レジストリの検査は req-lint.yml が受け持つ。ここは実装側だけを見る。
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 検査とビルドしかしない。checkout が既定でトークンを Git 設定へ残し、
# 後続の cargo の処理から触れる状態になるため、権限を落として保持もさせない
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 整形と静的検査
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: clippy と rustfmt の導入
        run: rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}

      - name: 整形の確認
        run: cargo fmt --all -- --check

      - name: 静的検査
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    # Cargo.toml が rust-version を宣言していても、CI がランナー標準の stable で
    # 組んでいる限り宣言は検証されない。宣言した版で通らないコードが入っても
    # 気づけず、宣言が実質的に無効になるため、宣言そのものを使って確かめる
    name: 宣言した最小 Rust 版
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 版を持つのは Cargo.toml だけにする。ワークフローへ値を書き写すと
      # 二重管理になり、片方だけ上げたときに検証が意味を失う
      - name: rust-version の読み出し
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Cargo.toml に rust-version がありません。" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "宣言された最小 Rust 版: ${version}"

      - name: 該当の toolchain の導入
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" \
            --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      # clippy ではなく check を使う。古い版の clippy が出す指摘は
      # 「その版で組めるか」とは別の話で、ここで見たいのは前者だけ。
      # 依存が宣言より新しい版を要求する場合もここで落ちる（それも宣言の誤り）
      - name: 宣言した版で組めるか
        run: cargo +${{ steps.msrv.outputs.version }} check --all-targets --locked

  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}

      # tests/ は要求の verification が指すテスト名をそのまま実装していく
      # 前提で、実装が進むまでは失敗する。それが TDD の Red であって異常ではない
      - name: テスト
        run: cargo test --all-targets --locked

  build:
    # linux/amd64 と linux/arm64 の双方で動く実行ファイルを提供すること自体が
    # 要求（REQ-0053）なので、両方のアーキテクチャで実際に組む。公開リポジトリ
    # なので arm64 のランナーが使え、クロスコンパイル環境を持ち込まずに済む
    name: ビルド (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.arch }}-cargo-build-${{ hashFiles('Cargo.lock') }}

      - name: リリースビルド
        run: cargo build --release --locked

      # 配布物が単一の実行ファイルで完結すること（REQ-0050）を、
      # 人手のレビューではなくビルドのたびに機械で見る
      - name: 単一実行ファイルであることの確認
        run: |
          file target/release/oci-cache
          ldd target/release/oci-cache || true
          # 併走する常駐プロセスや外部データベースを同梱していないこと。
          # 成果物が実行ファイル1つに収まっているかを目視できる形で残す
          ls -la target/release/oci-cache
