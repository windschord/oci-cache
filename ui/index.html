<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oci-cache</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>oci-cache</h1>
      <p class="note">複数の上流レジストリに対応する、パスを変えないプルスルーキャッシュ。</p>
    </header>

    <main>
      <!-- REQ-0040: 保存済みリポジトリの一覧 / REQ-0041: 取得元の上流表示 -->
      <!-- REQ-0017 / REQ-0045 / REQ-0047: 強制再取得と抑止時間中の操作抑制 -->
      <section id="catalog">
        <h2>保存済みイメージ</h2>
        <p class="placeholder" data-role="catalog-empty" hidden>保存済みのイメージはまだありません。</p>
        <table data-role="catalog-table" hidden>
          <thead>
            <tr>
              <th>リポジトリ</th>
              <th>タグ</th>
              <th>取得元</th>
              <th>ダイジェスト</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody data-role="catalog-rows"></tbody>
        </table>
      </section>

      <!-- REQ-0042: ヒットとミスの統計 / REQ-0044: メトリクス -->
      <section id="stats">
        <h2>統計</h2>
        <dl data-role="stats">
          <dt>blob 命中</dt>
          <dd data-field="blob_hits">-</dd>
          <dt>blob 不命中</dt>
          <dd data-field="blob_misses">-</dd>
          <dt>マニフェスト命中</dt>
          <dd data-field="manifest_hits">-</dd>
          <dt>マニフェスト不命中</dt>
          <dd data-field="manifest_misses">-</dd>
          <dt>保存領域の使用量</dt>
          <dd data-field="storage_bytes_used">-</dd>
        </dl>
        <p class="note"><a href="/metrics">/metrics</a>（Prometheus 形式）</p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
