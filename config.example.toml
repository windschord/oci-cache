# oci-cache の設定の雛形
#
# この値は figment 経由で読む（TOML + 環境変数）。実体は config.toml として
# 置き、.gitignore で追跡から外してある。認証情報を含みうるため。
#
# ここに書いてある既定値はすべて要求レジストリ側で決まっている値であり、
# 実装が既定値を変えるときは docs/requirements/ の該当要求を先に直すこと。
# 対応する要求 ID を各項目に併記してある。
#
# 注意: 実装は未着手のため、この雛形は「どの値が設定可能か」を要求から
# 起こしたものであって、キー名は実装時に確定する。

# ---------------------------------------------------------------------------
# 待ち受け
# ---------------------------------------------------------------------------
[server]
# 平文で待ち受ける宛先
listen = "0.0.0.0:5000"

# TLS を設定した時だけ TLS で受け付ける（REQ-0054）。
# Docker Engine は既定で TLS を要求するため、クライアント側に個別の設定変更を
# 強いたくない配備では証明書を置く。
# tls_cert = "/etc/oci-cache/fullchain.pem"
# tls_key  = "/etc/oci-cache/privkey.pem"

# ---------------------------------------------------------------------------
# 上流レジストリ
# ---------------------------------------------------------------------------
# 名前空間ヒントもルーティングメモも無い参照は、この順序で問い合わせて
# 最初に成功した上流を採る（REQ-0002 / REQ-0008 / REQ-0009）。
# 名前が衝突したときの決着もこの順序が決める（REQ-0007）。
#
# 順序を変えるとルーティングメモは破棄される（REQ-0058）。過去に解決した
# 取得元が新しい順序と食い違ったまま残ると、設定を変えた意味が出ないため。
[routing]
upstreams = ["docker.io", "ghcr.io", "quay.io"]

# 上流1つあたりの問い合わせを打ち切るまでの時間（REQ-0059、既定 5 秒）。
# 応答しない上流で探索全体が止まらないようにするためのもの。
probe_timeout = "5s"

# 「その上流には無い」という結果を覚えておく時間（REQ-0004 / REQ-0005、既定 30 分）。
# 存在しないリポジトリへの要求のたびに全上流を叩き直さないため。
negative_cache_ttl = "30m"

# ---------------------------------------------------------------------------
# 上流ごとの認証情報（REQ-0016）
# ---------------------------------------------------------------------------
# 認証情報の目的は Docker Hub の要求回数制限を緩めることに限る。
# 認証情報が無いと取得できない内容は保存しない（REQ-0013 / REQ-0019）ので、
# ここに認証情報を書いても非公開イメージの配信経路にはならない。
#
# [upstreams."docker.io".auth]
# username = "..."
# password = "..."

# ---------------------------------------------------------------------------
# キャッシュの有効期間
# ---------------------------------------------------------------------------
[cache]
# タグで取得したマニフェストの有効期間（REQ-0015、既定 30 分）。
# 経過後の要求で上流へ再問い合わせする（REQ-0011）。
# ここと negative_cache_ttl は設定で上書きできる（REQ-0018）。
tag_manifest_ttl = "30m"

# ダイジェスト指定のマニフェストは内容が変わりえないので有効期間を持たない
# （REQ-0012）。設定項目は無い。

# ---------------------------------------------------------------------------
# 保存領域
# ---------------------------------------------------------------------------
[storage]
# OCI Image Layout に従う保存先（REQ-0020）。索引の index.redb も同じ場所。
path = "./data"

# 上限。既定は保存先ファイルシステムの全容量の 50 パーセント（REQ-0026）で、
# 設定すればその値が優先される（REQ-0027）。
# 上限に達したら最終参照時刻の古い blob から削除する（REQ-0023）。
# capacity = "50GiB"

# ---------------------------------------------------------------------------
# Web UI
# ---------------------------------------------------------------------------
[ui]
# 同一イメージへの強制再取得を続けて受け付けない時間（REQ-0046、既定 60 秒）。
# 抑止時間の間は要求を拒否し（REQ-0045）、UI の操作自体も無効にする（REQ-0047）。
force_refresh_cooldown = "60s"

# ---------------------------------------------------------------------------
# 常駐メモリの上限に相当する設定は持たない（REQ-0055）
# ---------------------------------------------------------------------------
# 上限は systemd の MemoryMax やコンテナ実行環境の設定で課す。
# 二重の制御にすると障害時の切り分けが難しくなるため、ここには置かない。
